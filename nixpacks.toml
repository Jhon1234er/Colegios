[phases.setup]
nixPkgs = [
  'php81',
  'php81Extensions.gd',
  'php81Extensions.mbstring',
  'php81Extensions.xml',
  'php81Extensions.zip',
  'php81Extensions.dom',
  'php81Extensions.simplexml',
  'php81Extensions.fileinfo',
  'php81Extensions.pdo_mysql'
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader'
]

[start]
cmd = "php -S 0.0.0.0:${PORT} -t public"
